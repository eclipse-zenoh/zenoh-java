[package]
name = "prebindgen-ext"
version = "1.0.0"
edition = "2021"
license = "EPL-2.0 OR Apache-2.0"
description = "Prebindgen JNI extensions for Zenoh."
repository = "https://github.com/eclipse-zenoh/zenoh"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
prebindgen = "0.4.1"
itertools = "0.12"
jni = "0.21.1"
