[package]
rust-version = "1.75.0"
version = "1.9.0"
repository = "https://github.com/eclipse-zenoh/zenoh"
homepage = "http://zenoh.io"
edition = "2021"
license = "EPL-2.0 OR Apache-2.0"
categories = ["network-programming"]
description = "Zenoh: Zero Overhead Pub/sub, Store/Query and Compute."
name = "zenoh_jni"

[features]
default = ["zenoh-default", "zenoh-ext"]
# Re-export of zenoh's "default" features under a name that dependents can
# enable through this crate's [features] table (Cargo disallows raw `zenoh/…`
# in a dependent's `features = […]` list, so we need a passthrough feature).
zenoh-default = ["zenoh/default"]
# Vestigial gating left in place so the standalone dylib build can be
# re-enabled by hand (turn this feature on AND add `dylib` to crate-type).
# In the normal build path, zenoh-flat-jni's `outdated/` shim re-exports
# every Java_… symbol, so this is off by default.
export_jni_symbols = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
android-logd-logger = "0.4.0"
async-std = { version = "=1.12.0", default-features = false }
clap = "3.2.23"
jni = "0.21.1"
flume = "0.10.14"
uhlc = "0.8.0"
json5 = "0.4.1"
serde_yaml = "0.9.19"
zenoh = { version = "1.9.0", git = "https://github.com/eclipse-zenoh/zenoh.git", branch = "main", features = ["unstable", "internal"], default-features = false }
zenoh-ext = { version = "1.9.0", git = "https://github.com/eclipse-zenoh/zenoh.git", branch = "main", features = ["internal"], default-features = false, optional = true }
tracing = { version = "0.1" , features = ["log"] }
[lib]
name = "zenoh_jni"
# Plain rlib: the JNI ABI is now exported through zenoh-flat-jni's outdated/
# shim, which links zenoh-jni as a regular Rust library. No standalone dylib.

[build-dependencies]
rustc_version = "0.4.0"

[profile.release]
debug = false     # If you want debug symbol in release mode, set the env variable: RUSTFLAGS=-g
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
